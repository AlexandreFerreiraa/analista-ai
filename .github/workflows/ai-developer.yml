name: AI Agent Developer
on:
  issues:
    types: [opened]

jobs:
  coding:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write  # Permissão crucial para fechar a issue
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - run: pip install google-genai
      
      - name: Executar Agente
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/ai_agent.py

      - name: Salvar Alterações
        run: |
          git config --global user.name "GitHub Action AI"
          git config --global user.email "ai-agent@github.com"
          git add .
          git commit -m "🤖 IA: Atualizando lógica conforme Issue #${{ github.event.issue.number }}" || echo "Sem mudanças"
          git push
